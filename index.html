<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Portfolio - Rodel Jr. Ganancial</title>
    <meta name="description" content="Resume-style portfolio generated from JSON data" />
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>

<body>
    <div class="wrap">
        <div class="about-section" id="about-section"></div>
        <div class="work-experience-section" id="work-experience-section"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error('no data.json');
                const json = await res.json();
                return json;
            } catch (e) {
                console.warn('Using fallback sample data. Add data.json to your repo to load real data.', e);
            }
        }

        function el(tag, cls) { const n = document.createElement(tag); if (cls) n.className = cls; return n }

        function renderAboutSection(data) {
            const container = document.getElementById('about-section'); container.innerHTML = '';
            const av = el('div', 'avatar');
            const name = el('h1'); name.textContent = data.name;
            const role = el('div', 'role'); role.textContent = data.role;
            const about = el('p', 'about'); about.textContent = data.about;
            container.append(av, name, role, about);

            const contactSec = el('div', 'section'); contactSec.innerHTML = '<h3>Contacts</h3>';
            const cl = el('div', 'contact-list');
            const fields = [
                { icon: '✉️', val: `<a class="link" href="mailto:${data.contact.email}">${data.contact.email}</a>` },
                {
                    icon: `<svg height="16" width="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762
                    0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11.75 19h-3.25v-10h3.25v10zm-1.625
                    -11.267c-1.038 0-1.875-.847-1.875-1.875s.837-1.875 1.875-1.875
                    1.875.847 1.875 1.875-.837 1.875-1.875 1.875zm13.375
                    11.267h-3.25v-5.604c0-1.338-.026-3.063-1.868-3.063-1.869
                    0-2.156 1.46-2.156 2.97v5.697h-3.25v-10h3.125v1.367h.044c.435-.823
                    1.5-1.688 3.087-1.688 3.3 0 3.906 2.172 3.906 4.994v5.327z"/>
                    </svg>`,
                    val: `<a class="link" href="${data.contact.linkedin}" target="_blank">linkedin</a>`
                },
                {
                    icon: `<svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;margin-right:4px">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
                    -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82
                    .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
                    .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
                    0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>`,
                    val: `<a class="link" href="https://github.com/${data.contact.github}" target="_blank">github</a>`
                },
                { icon: '📍', val: data.contact.location },
            ];

            fields.forEach(f => { const d = el('div', 'chip'); d.innerHTML = `${f.icon} ${f.val}`; cl.appendChild(d) });
            contactSec.appendChild(cl);
            container.appendChild(contactSec);

            const tsec = el('div', 'section'); tsec.innerHTML = '<h3>Tech Stacks</h3>';
            const skillsWrap = el('div', 'skills');
            (data.techStacks || []).forEach(g => {
                const groupTitle = el('div', 'chip'); groupTitle.textContent = g.group; groupTitle.style.fontWeight = '700'; groupTitle.style.width = '100%'; skillsWrap.appendChild(groupTitle);
                g.items.forEach(it => { const s = el('div', 'skill'); s.textContent = it; skillsWrap.appendChild(s) });
            });
            tsec.appendChild(skillsWrap);
            container.appendChild(tsec);
            const footer = el('footer'); footer.textContent = 'Keep learning, keep coding, and let curiosity drive your progress.'; container.appendChild(footer);
        }

        function setupModal() {
            const overlay = el('div', 'modal-overlay');
            overlay.innerHTML = `
                <div class="modal-box">
                    <div class="modal-img-area">
                        <div class="modal-img-wrap">
                            <img class="modal-img" src="" alt="" />
                        </div>
                        <button class="modal-close" aria-label="Close">&#x2715;</button>
                        <button class="modal-nav modal-prev" aria-label="Previous">&#8249;</button>
                        <button class="modal-nav modal-next" aria-label="Next">&#8250;</button>
                    </div>
                    <div class="modal-footer">
                        <div class="modal-dots"></div>
                        <span class="modal-counter"></span>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            let images = [], current = 0;
            const img = overlay.querySelector('.modal-img');
            const imgWrap = overlay.querySelector('.modal-img-wrap');
            const counter = overlay.querySelector('.modal-counter');
            const dotsWrap = overlay.querySelector('.modal-dots');
            const prevBtn = overlay.querySelector('.modal-prev');
            const nextBtn = overlay.querySelector('.modal-next');

            function goTo(i) {
                current = (i + images.length) % images.length;
                img.style.opacity = '0';
                setTimeout(() => {
                    const src = `assets/${images[current]}`;
                    img.src = src;
                    imgWrap.style.setProperty('--modal-bg', `url(${src})`);
                    img.style.opacity = '1';
                }, 130);
                counter.textContent = images.length > 1 ? `${current + 1} / ${images.length}` : '';
                dotsWrap.querySelectorAll('.modal-dot').forEach((d, idx) => d.classList.toggle('active', idx === current));
            }

            function close() { overlay.classList.remove('open'); document.body.style.overflow = ''; }

            prevBtn.addEventListener('click', () => goTo(current - 1));
            nextBtn.addEventListener('click', () => goTo(current + 1));
            overlay.querySelector('.modal-close').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            document.addEventListener('keydown', e => {
                if (!overlay.classList.contains('open')) return;
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowLeft') goTo(current - 1);
                if (e.key === 'ArrowRight') goTo(current + 1);
            });

            window.openImgModal = function(imgs, startIndex) {
                images = imgs;
                current = startIndex;
                dotsWrap.innerHTML = '';
                if (images.length > 1) {
                    images.forEach((_, i) => {
                        const dot = el('span', i === startIndex ? 'modal-dot active' : 'modal-dot');
                        dot.addEventListener('click', () => goTo(i));
                        dotsWrap.appendChild(dot);
                    });
                }
                prevBtn.style.display = images.length > 1 ? '' : 'none';
                nextBtn.style.display = images.length > 1 ? '' : 'none';
                img.style.opacity = '1';
                const initialSrc = `assets/${images[current]}`;
                img.src = initialSrc;
                imgWrap.style.setProperty('--modal-bg', `url(${initialSrc})`);
                counter.textContent = images.length > 1 ? `${current + 1} / ${images.length}` : '';
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            };
        }

        function buildProjectCard(p) {
            const images = p.images || (p.image ? [p.image] : []);
            const card = el('div', 'project');
            const imgContainer = el('div', 'project-img-container');

            imgContainer.style.setProperty('--img-bg', `url(assets/${images[0]})`);

            const visible = images.slice(0, 3);
            const extra = images.length - 3;
            const collage = el('div', `project-collage count-${visible.length}`);

            visible.forEach((imgSrc, i) => {
                const item = el('div', 'collage-item');
                item.setAttribute('role', 'button');
                item.setAttribute('tabindex', '0');
                item.addEventListener('click', () => window.openImgModal(images, i));
                item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') window.openImgModal(images, i); });
                const img = el('img');
                img.src = `assets/${imgSrc}`;
                img.alt = `${p.title} screenshot ${i + 1}`;
                img.className = 'project-img';
                item.appendChild(img);
                if (i === 2 && extra > 0) {
                    const more = el('div', 'collage-more');
                    more.textContent = `+${extra}`;
                    item.appendChild(more);
                }
                collage.appendChild(item);
            });

            imgContainer.appendChild(collage);

            const tooltip = el('div', 'tooltip');
            tooltip.textContent = `View image${images.length > 1 ? 's' : ''}`;
            imgContainer.appendChild(tooltip);

            card.appendChild(imgContainer);

            const h = el('h4');
            h.textContent = p.title;

            const d = el('div', 'desc');
            d.textContent = p.desc;

            const badges = el('div', 'badges');
            (p.tech || []).forEach(t => {
                const b = el('div', 'badge');
                b.textContent = t;
                badges.appendChild(b);
            });

            card.append(h, d, badges);

            if (p.public && p.link && p.link !== '#') {
                const linkBtn = el('a', 'project-link-btn');
                linkBtn.href = p.link;
                linkBtn.target = '_blank';
                linkBtn.rel = 'noopener noreferrer';
                linkBtn.innerHTML = `Visit Site <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
                card.appendChild(linkBtn);
            }

            return card;
        }

        function renderWorkExperienceSection(data) {
            const container = document.getElementById('work-experience-section');
            container.innerHTML = '';

            if (data.workExperience && data.workExperience.length > 0) {
                const expSec = el('section', 'section');
                const expList = el('div', 'experience-list');
                expList.innerHTML = '<h1>Work Experience</h1>';

                data.workExperience.forEach(job => {
                    const card = el('div', 'job-card');

                    const header = el('div', 'job-header');
                    const titleRow = el('div', 'job-title-row');
                    const title = el('h3', 'job-title');
                    title.textContent = job.title;
                    const date = el('span', 'job-date');
                    date.textContent = job.employmentDate;
                    titleRow.append(title, date);

                    const company = el('div', 'job-company');
                    company.innerHTML = `<span class="job-type">${job.isFullTime ? 'Full-Time' : 'Part-Time'}</span> @ ${job.company}`;
                    header.append(titleRow, company);

                    const ul = el('ul', 'job-desc');
                    (job.descriptions || []).forEach(d => {
                        const li = el('li');
                        li.textContent = d.item;
                        ul.appendChild(li);
                    });

                    card.append(header, ul);

                    // Projects accordion
                    const relatedProjects = (data.projects || []).filter(p =>
                        (job.projectRefs || []).includes(p.title)
                    );

                    if (relatedProjects.length > 0) {
                        const toggleBtn = el('button', 'projects-toggle');
                        toggleBtn.innerHTML = `
                            <span class="projects-toggle-label">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                ${relatedProjects.length === 1 ? 'Project' : 'Projects'}
                                <span class="projects-count">${relatedProjects.length}</span>
                            </span>
                            <svg class="toggle-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        `;

                        const panel = el('div', 'projects-panel');
                        relatedProjects.forEach(p => panel.appendChild(buildProjectCard(p)));

                        toggleBtn.addEventListener('click', () => {
                            const isOpen = toggleBtn.classList.contains('open');
                            toggleBtn.classList.toggle('open', !isOpen);
                            panel.classList.toggle('open', !isOpen);
                        });

                        card.append(toggleBtn, panel);
                    }

                    expList.appendChild(card);
                });

                expSec.appendChild(expList);
                container.appendChild(expSec);
            }
        }

        (async () => { setupModal(); const data = await loadData(); renderAboutSection(data); renderWorkExperienceSection(data); })();
    </script>
</body>

</html>
